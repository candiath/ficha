name: Tests

on:
  # Only on PRs. The PR already tests the merge of its branch into the base,
  # so running again on the push that merges it repeats the same tree (it used
  # to run on push to dev: half of the CI time for no new information). If two
  # PRs to dev ever conflict semantically after merging, the release PR to
  # main tests the combined tree before it reaches production.
  pull_request:
  # A demanda, sobre cualquier rama. No es un lujo: lo que el CI valida depende
  # de credenciales que viven fuera del repo (CI_DATABASE_URL),
  # así que un check en verde afirma algo sobre un commit en un momento, no
  # sobre el estado de hoy. Después de rotar una clave hay que poder volver a
  # correrlo sin inventar un push ni depender de que exista un run viejo para
  # re-ejecutar.
  workflow_dispatch:
    inputs:
      reset_ci_db:
        description: "Rebuild the ci database from scratch (migrate reset) before the tests, as release PRs do"
        type: boolean
        default: false

# If pushes to the same PR arrive in a row, cancel the old run: only the last
# one matters, and on Neon (release PRs, manual runs) the ci branch is shared,
# so two runs of the same ref would also step on each other.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the two test jobs have anything to check, from the files
  # the PR changes. Default is to run: a job is skipped only when the change
  # provably cannot affect it.
  #   - docs-only (docs/, tasks/, .claude/, .notes/, *.md): nothing to run.
  #   - only apps/web/: no API integration tests (the web job still runs,
  #     and its `npm run check` typechecks the API too).
  # Manual runs and release PRs to main always run everything.
  #
  # It also decides where the API tests run (`neon`):
  #   - PRs to dev: a throwaway Postgres in Docker on the runner (`npm test`,
  #     as locally). Each run has its own database, so an open PR's migration
  #     can no longer reach another PR's run, as it did through the shared ci
  #     branch on 2026-10-24.
  #   - Release PRs to main and manual runs: Neon's ci branch, whose pooler
  #     and latency Docker cannot reproduce (docs/infra.md#local-test-database).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      api: ${{ steps.diff.outputs.api }}
      neon: ${{ steps.diff.outputs.neon }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clasificar los archivos cambiados
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" = "main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "neon=true" >> "$GITHUB_OUTPUT"
            echo "Full run on Neon ($EVENT, base: ${BASE_REF:-none})."
            exit 0
          fi
          echo "neon=false" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$files"
          code=$(echo "$files" | grep -vE '^(docs/|tasks/|\.claude/|\.notes/)|\.md$' || true)
          api=$(echo "$code" | grep -vE '^apps/web/' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "api=$([ -n "$api" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Job aparte del de la API: no necesita DB ni secrets, y en paralelo
  # no alarga el tiempo total del CI.
  #
  # Both test jobs always run, even with nothing to check: `test` and
  # `test-web` are required status checks in the ruleset, and a job that is
  # skipped as a whole never reports, which would block the merge. Skipping
  # their steps instead reports success in seconds.
  test-web:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Sin cambios de código
        if: needs.changes.outputs.code != 'true'
        run: echo 'Docs-only change, nothing to lint or test.'

      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-node@v5
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      # Solo lee schema.prisma (no toca la DB): el typecheck de la api
      # importa el cliente generado.
      - name: Generar el cliente de Prisma
        if: needs.changes.outputs.code == 'true'
        run: npx prisma generate
        working-directory: apps/api

      # El mismo comando que se corre localmente antes de pushear.
      - name: Lint y typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run check

      - name: Tests del frontend
        if: needs.changes.outputs.code == 'true'
        run: npm test -w apps/web

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Sin cambios que afecten a la API
        if: needs.changes.outputs.api != 'true'
        run: echo 'No API-relevant change, integration tests skipped.'

      - uses: actions/checkout@v5
        if: needs.changes.outputs.api == 'true'

      - uses: actions/setup-node@v5
        if: needs.changes.outputs.api == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        if: needs.changes.outputs.api == 'true'
        run: npm ci

      - name: Generar el cliente de Prisma
        if: needs.changes.outputs.api == 'true'
        run: npx prisma generate
        working-directory: apps/api

      # La API importa valores de runtime de @ficha/shared (los schemas de Zod
      # de la evaluación), no solo tipos: sin el dist compilado, el import falla
      # al arrancar los tests. En Render esto ya pasa porque el build corre
      # `build:api`, que buildea shared primero.
      - name: Buildear el paquete compartido
        if: needs.changes.outputs.api == 'true'
        run: npm run build -w packages/shared

      # PRs to dev: the same command as locally. The script starts the test-db
      # container of docker-compose.yml, migrates it from empty, runs
      # audit-guards.sql and then vitest. No secret is involved: the database
      # lives and dies with the runner, so nothing another run did can reach it.
      - name: Integration tests on a throwaway Postgres (PRs to dev)
        if: needs.changes.outputs.api == 'true' && needs.changes.outputs.neon != 'true'
        run: npm test

      # Every step from here on runs on Neon's ci branch: release PRs to main
      # and manual runs only.
      #
      # Release PRs (or a manual run with reset_ci_db): rebuild the ci database from an empty schema, so the
      # whole migration chain is proven to apply from scratch (what a brand
      # new environment does) before it reaches production. It also clears the
      # test rows that interrupted runs leave behind. A manual run without it
      # only applies the migrations ci has not seen yet (next step).
      #
      # migrate reset destroys everything, so it first refuses to run on any
      # database holding a non-test account: every environment but CI has
      # one (the demo admin, real users, the operator), and the ci branch only
      # ever gets @test.ficha.local accounts. No config to keep in sync, and
      # if CI_DATABASE_URL is ever pointed somewhere else by mistake, this
      # fails instead of wiping it.
      - name: Comprobar que la base es la de CI (release o manual)
        if: needs.changes.outputs.api == 'true' && (github.base_ref == 'main' || inputs.reset_ci_db)
        run: |
          url="${DATABASE_URL/-pooler/}"
          non_test=0
          for table in users platform_operators; do
            exists=$(psql "$url" -tAc "SELECT to_regclass('public.$table') IS NOT NULL")
            if [ "$exists" = "t" ]; then
              n=$(psql "$url" -tAc "SELECT count(*) FROM $table WHERE email NOT LIKE '%@test.ficha.local'")
              non_test=$((non_test + n))
            fi
          done
          if [ "$non_test" -ne 0 ]; then
            echo "::error::Refusing to reset: the database has $non_test non-test account(s). Is CI_DATABASE_URL really the ci branch?"
            exit 1
          fi
          echo "Only test accounts found: safe to reset."
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Reconstruir la base de CI desde cero (release o manual)
        if: needs.changes.outputs.api == 'true' && (github.base_ref == 'main' || inputs.reset_ci_db)
        run: |
          export DIRECT_DATABASE_URL="${DATABASE_URL/-pooler/}"
          npx prisma migrate reset --force --skip-seed
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      # Idempotente: aplica solo las migraciones pendientes.
      # El datasource declara directUrl para que migrate no pase por el pooler
      # (el porqué está en schema.prisma). Lo derivamos de la misma secret
      # sacándole `-pooler`; si la URL no lo tiene, queda igual.
      - name: Aplicar migraciones
        if: needs.changes.outputs.api == 'true' && needs.changes.outputs.neon == 'true'
        run: |
          export DIRECT_DATABASE_URL="${DATABASE_URL/-pooler/}"
          npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      # The ci branch persists between the runs that use it, and the ruleset
      # does not require branches to be up to date. So a manual run on a branch
      # behind dev can find migrations that an earlier run applied and this
      # branch does not have: its code then runs against a newer schema (a
      # dropped column) and dozens of tests fail with P2022 after the whole
      # suite. Fail here instead, in seconds, naming them.
      # `prisma migrate status` cannot do it: Prisma 5.22 reports such a
      # database as "up to date" with exit 0 (it only reports migrations
      # missing locally when the histories diverge), so the check reads
      # `_prisma_migrations` itself. Release PRs reset the database first, so
      # it holds exactly their migrations and this step passes.
      - name: Check the database has no migrations this branch lacks
        if: needs.changes.outputs.api == 'true' && needs.changes.outputs.neon == 'true'
        run: |
          url="${DATABASE_URL/-pooler/}"
          applied=$(psql "$url" -tAc "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY 1")
          local_dirs=$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          missing=$(comm -23 <(echo "$applied" | sort) <(echo "$local_dirs"))
          if [ -n "$missing" ]; then
            echo "::error::The ci database has migrations that this branch does not have. An earlier run applied them; this branch is behind dev. Merge dev into this branch (git merge origin/dev) and push, or rerun with reset_ci_db."
            echo "Applied to the ci database but missing in prisma/migrations:"
            echo "$missing"
            exit 1
          fi
          echo "Every migration applied to the ci database exists in this branch."
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      # The audit tables' triggers, functions and foreign keys are what the
      # migrations deployed (#186): checked here before the PR reaches staging,
      # whose Render build runs the same file. ci carries the maintenance flag on
      # purpose, so no-audit-maintenance.sql is not run here.
      - name: Check the audit guarantees
        if: needs.changes.outputs.api == 'true' && needs.changes.outputs.neon == 'true'
        run: |
          export DIRECT_DATABASE_URL="${DATABASE_URL/-pooler/}"
          npm run db:check:audit-guards
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Integration tests on Neon (release PRs and manual runs)
        if: needs.changes.outputs.api == 'true' && needs.changes.outputs.neon == 'true'
        # The audit tests of #186 need a direct (non-pooled) connection, derived
        # the same way as in the migrate steps. test:neon, not test: `npm test`
        # runs on Docker, and this run exists for what Docker cannot reproduce,
        # Neon's pooler and latency (docs/infra.md#local-test-database).
        run: |
          export DIRECT_DATABASE_URL="${DATABASE_URL/-pooler/}"
          npm run test:neon
        env:
          # Branch de Neon dedicada a CI — nunca la DB de dev.
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
