name: Tests

on:
  # Only on PRs. The PR already tests the merge of its branch into the base,
  # so running again on the push that merges it repeats the same tree (it used
  # to run on push to dev: half of the CI time for no new information). If two
  # PRs to dev ever conflict semantically after merging, the release PR to
  # main tests the combined tree before it reaches production.
  pull_request:
  # A demanda, sobre cualquier rama. No es un lujo: lo que el CI valida depende
  # de credenciales que viven fuera del repo (CI_DATABASE_URL),
  # así que un check en verde afirma algo sobre un commit en un momento, no
  # sobre el estado de hoy. Después de rotar una clave hay que poder volver a
  # correrlo sin inventar un push ni depender de que exista un run viejo para
  # re-ejecutar.
  workflow_dispatch:

# Si llegan pushes seguidos al mismo PR, cancela la corrida vieja: los tests
# van contra una DB compartida (branch de CI en Neon) y no tiene sentido
# pagar dos corridas cuando solo importa la última.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the two test jobs have anything to check, from the files
  # the PR changes. Default is to run: a job is skipped only when the change
  # provably cannot affect it.
  #   - docs-only (docs/, tasks/, .claude/, .notes/, *.md): nothing to run.
  #   - only apps/web/: no API integration tests (the web job still runs,
  #     and its `npm run check` typechecks the API too).
  # Manual runs and release PRs to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clasificar los archivos cambiados
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" = "main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "Full run ($EVENT, base: ${BASE_REF:-none})."
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$files"
          code=$(echo "$files" | grep -vE '^(docs/|tasks/|\.claude/|\.notes/)|\.md$' || true)
          api=$(echo "$code" | grep -vE '^apps/web/' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "api=$([ -n "$api" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Job aparte del de la API: no necesita DB ni secrets, y en paralelo
  # no alarga el tiempo total del CI.
  #
  # Both test jobs always run, even with nothing to check: `test` and
  # `test-web` are required status checks in the ruleset, and a job that is
  # skipped as a whole never reports, which would block the merge. Skipping
  # their steps instead reports success in seconds.
  test-web:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Sin cambios de código
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change: nothing to lint or test."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-node@v5
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      # Solo lee schema.prisma (no toca la DB): el typecheck de la api
      # importa el cliente generado.
      - name: Generar el cliente de Prisma
        if: needs.changes.outputs.code == 'true'
        run: npx prisma generate
        working-directory: apps/api

      # El mismo comando que se corre localmente antes de pushear.
      - name: Lint y typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run check

      - name: Tests del frontend
        if: needs.changes.outputs.code == 'true'
        run: npm test -w apps/web

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Sin cambios que afecten a la API
        if: needs.changes.outputs.api != 'true'
        run: echo "No API-relevant change: integration tests skipped."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.api == 'true'

      - uses: actions/setup-node@v5
        if: needs.changes.outputs.api == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        if: needs.changes.outputs.api == 'true'
        run: npm ci

      - name: Generar el cliente de Prisma
        if: needs.changes.outputs.api == 'true'
        run: npx prisma generate
        working-directory: apps/api

      # La API importa valores de runtime de @ficha/shared (los schemas de Zod
      # de la evaluación), no solo tipos: sin el dist compilado, el import falla
      # al arrancar los tests. En Render esto ya pasa porque el build corre
      # `build:api`, que buildea shared primero.
      - name: Buildear el paquete compartido
        if: needs.changes.outputs.api == 'true'
        run: npm run build -w packages/shared

      # Idempotente: aplica solo las migraciones pendientes, así la branch
      # de CI acompaña a los PRs que traen migraciones nuevas.
      # El datasource declara directUrl para que migrate no pase por el pooler
      # (el porqué está en schema.prisma). Lo derivamos de la misma secret
      # sacándole `-pooler`; si la URL no lo tiene, queda igual.
      - name: Aplicar migraciones
        if: needs.changes.outputs.api == 'true'
        run: |
          export DIRECT_DATABASE_URL="${DATABASE_URL/-pooler/}"
          npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Tests de integración de la API
        if: needs.changes.outputs.api == 'true'
        run: npm test
        env:
          # Branch de Neon dedicada a CI — nunca la DB de dev.
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
