name: API image

# Builds the API's Docker image and publishes it to GHCR, where the VPS picks
# it up within 5 minutes (ops/deploy.sh). Tags: the branch (`main` for
# production, `dev` for staging) and `sha-<full commit>` for rollbacks.
#
# On push, like Render did: the tests already ran on the PR that produced this
# push (the release PR for `main`), the same reasoning that keeps test.yml off
# push events. Pushes only come from people with write access, so a fork can
# never publish an image.
on:
  push:
    branches: [main, dev]
    paths:
      - apps/api/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/image.yml
  # To publish a branch's image without a new commit (the first time, or after
  # a change outside the paths above that the image depends on).
  workflow_dispatch:

# Two pushes to the same branch build in order; the newer one wins the tag.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    # A manual run on any other branch would publish a tag no server follows.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/candiath/ficha-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
