name: API image

# Builds the API's Docker image and publishes it to GHCR, where the VPS picks
# it up within 5 minutes (ops/deploy.sh). Tags: the branch (`main` for
# production, `dev` for staging) and `sha-<full commit>` for rollbacks.
#
# On push, like Render did: the tests already ran on the PR that produced this
# push (the release PR for `main`), the same reasoning that keeps test.yml off
# push events. Pushes only come from people with write access, so a fork can
# never publish an image.
#
# Every push, with no `paths` filter, as Render rebuilt on every push: the API
# reports the commit time it was built from (X-Build-Version) and the web
# blocks while the API is older than itself (lib/buildVersion.ts). With a
# filter, a web-only push moved the web ahead and left the API image behind,
# and the web stayed on "Estamos actualizando" until someone rebuilt it.
on:
  push:
    branches: [main, dev]
  # To publish a branch's image without a new commit (the first time, or to
  # rebuild one).
  workflow_dispatch:

# Two pushes to the same branch build in order; the newer one wins the tag.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    # A manual run on any other branch would publish a tag no server follows.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/candiath/ficha-api
    steps:
      - uses: actions/checkout@v4

      # The commit time is the build version the API reports (X-Build-Version,
      # scripts/build-version.mjs); the image's build context has no .git.
      - id: version
        run: echo "build_version=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.build_version }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
