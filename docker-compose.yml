services:
  db:
    image: postgres:16-alpine
    container_name: ficha_db
    environment:
      POSTGRES_USER: ficha
      POSTGRES_PASSWORD: ficha
      POSTGRES_DB: ficha_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficha -d ficha_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
